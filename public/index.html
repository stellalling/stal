<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · STAL 洛谷比赛订阅</title>
<meta name="description" content="洛谷比赛信息聚合与邮件订阅推送平台">
<link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
<link rel="apple-touch-icon" href="/assets/img/logo.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-grid">
    <section class="auth-hero">
      <div class="brand" style="margin-bottom:18px">
        <img class="brand-mark" src="/assets/img/logo.svg" alt="STAL" width="30" height="30">
        <span id="site-name">STAL</span>
      </div>
      <h1>不再错过任何一场<br>洛谷比赛</h1>
      <p class="lead" id="site-tagline">按你的偏好订阅洛谷比赛，每天 20:00 收到次日赛程提醒。</p>

      <div id="smtp-notice" class="notice" style="margin-top:16px; display:none"></div>
    </section>

    <section class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" data-tab="login" class="active">登录</button>
        <button type="button" data-tab="register">注册</button>
        <button type="button" data-tab="reset">找回密码</button>
      </div>

      <form id="form-login" class="stack" autocomplete="on">
        <div class="field">
          <label class="label" for="login-email">邮箱</label>
          <input class="input" id="login-email" type="email" name="email" placeholder="you@example.com" required autocomplete="username">
        </div>
        <div class="field">
          <label class="label" for="login-password">密码</label>
          <input class="input" id="login-password" type="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <button class="btn btn-block" type="submit">登录</button>
        <p class="hint center">还没有账号？<a href="#" data-goto="register">立即注册</a></p>
      </form>

      <form id="form-register" class="stack hidden" autocomplete="on">
        <div class="field">
          <label class="label" for="reg-email">邮箱</label>
          <input class="input" id="reg-email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label class="label" for="reg-code">邮箱验证码</label>
          <div class="input-group">
            <input class="input" id="reg-code" inputmode="numeric" maxlength="6" placeholder="6 位数字" required>
            <button class="btn btn-ghost" type="button" id="reg-send">获取验证码</button>
          </div>
          <span class="hint" id="reg-hint">验证码 10 分钟内有效</span>
        </div>
        <div class="field">
          <label class="label" for="reg-password">设置密码</label>
          <input class="input" id="reg-password" type="password" placeholder="至少 8 位，包含字母和数字" required autocomplete="new-password">
        </div>
        <div class="field">
          <label class="label" for="reg-password2">确认密码</label>
          <input class="input" id="reg-password2" type="password" placeholder="再次输入密码" required autocomplete="new-password">
        </div>
        <button class="btn btn-block" type="submit">注册并登录</button>
        <p class="hint center">已有账号？<a href="#" data-goto="login">返回登录</a></p>
      </form>

      <form id="form-reset" class="stack hidden" autocomplete="on">
        <p class="hint">输入注册邮箱，我们会发送验证码，验证通过后即可设置新密码。</p>
        <div class="field">
          <label class="label" for="reset-email">注册邮箱</label>
          <input class="input" id="reset-email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label class="label" for="reset-code">邮箱验证码</label>
          <div class="input-group">
            <input class="input" id="reset-code" inputmode="numeric" maxlength="6" placeholder="6 位数字" required>
            <button class="btn btn-ghost" type="button" id="reset-send">获取验证码</button>
          </div>
        </div>
        <div class="field">
          <label class="label" for="reset-password">新密码</label>
          <input class="input" id="reset-password" type="password" placeholder="至少 8 位，包含字母和数字" required autocomplete="new-password">
        </div>
        <button class="btn btn-block" type="submit">重置密码</button>
        <p class="hint center"><a href="#" data-goto="login">返回登录</a></p>
      </form>
    </section>
  </div>
</main>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
