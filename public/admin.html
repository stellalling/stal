<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · STAL 洛谷比赛订阅</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
<link rel="apple-touch-icon" href="/assets/img/logo.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
  <div class="container">
    <div class="page-head">
      <h1>管理后台</h1>
      <p class="sub">抓取与邮件推送的运行状态、SMTP 配置与手动触发入口。</p>
    </div>

    <div class="stats" id="admin-stats"></div>

    <div class="layout" style="grid-template-columns:minmax(0,1fr) 320px">
      <div class="stack">
        <section class="card">
          <div class="card-head">
            <h2>手动操作</h2>
            <span class="hint" id="action-hint"></span>
          </div>
          <div class="card-body row" style="flex-wrap:wrap;gap:8px">
            <button class="btn" id="btn-crawl">立即抓取比赛</button>
            <button class="btn btn-soft" id="btn-dry">演练每日推送（不发信）</button>
            <button class="btn btn-ghost" id="btn-send">立即推送次日比赛</button>
            <button class="btn btn-ghost" id="btn-queue">继续处理队列</button>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>SMTP / 推送配置</h2></div>
          <div class="card-body stack">
            <div id="smtp-hint"></div>
            <div class="row" style="gap:12px;flex-wrap:wrap">
              <div class="field" style="flex:1;min-width:240px;margin:0">
                <label class="label" for="smtp-user">发件 QQ 邮箱</label>
                <input class="input" id="smtp-user" placeholder="yourname@qq.com">
              </div>
              <div class="field" style="flex:1;min-width:240px;margin:0">
                <label class="label" for="smtp-pass">SMTP 授权码</label>
                <input class="input" id="smtp-pass" type="password" placeholder="留空表示不修改">
              </div>
            </div>
            <div class="row" style="gap:12px;flex-wrap:wrap">
              <div class="field" style="flex:1;min-width:180px;margin:0">
                <label class="label" for="smtp-from">发件人显示名</label>
                <input class="input" id="smtp-from">
              </div>
              <div class="field" style="width:150px;margin:0">
                <label class="label" for="smtp-hour">每日推送小时</label>
                <input class="input" id="smtp-hour" type="number" min="0" max="23">
              </div>
              <div class="field" style="width:150px;margin:0">
                <label class="label" for="smtp-rate">每分钟封数</label>
                <input class="input" id="smtp-rate" type="number" min="1" max="60">
              </div>
            </div>
            <div class="row">
              <button class="btn" id="btn-save-smtp">保存配置</button>
              <button class="btn btn-ghost" id="btn-verify-smtp">测试 SMTP 登录</button>
            </div>
            <p class="hint">配置会写入 <code class="mono">config.json</code>。QQ 邮箱需要在「设置 → 账户 → POP3/SMTP服务」中开启并生成授权码。</p>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>发送队列</h2>
            <span class="hint" id="queue-hint"></span>
          </div>
          <div class="card-body" style="padding:0">
            <table class="table">
              <thead><tr><th>用户</th><th>收件人（Bcc）</th><th>比赛数</th><th>状态</th><th>时间</th></tr></thead>
              <tbody id="queue-body"></tbody>
            </table>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>运行日志</h2></div>
          <div class="card-body stack">
            <div class="tabs" id="log-tabs">
              <button class="tab active" data-log="mail">邮件日志</button>
              <button class="tab" data-log="crawl">抓取日志</button>
            </div>
            <div class="log" id="log-body">加载中…</div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>用户管理</h2>
            <span class="hint" id="user-count"></span>
          </div>
          <div class="card-body" style="padding:0">
            <table class="table">
              <thead><tr><th>邮箱</th><th>角色</th><th>收件人</th><th>注册时间</th><th>最近登录</th><th>操作</th></tr></thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
        </section>
      </div>

      <aside class="sidebar">
        <section class="card">
          <div class="card-head"><h3>运行状态</h3></div>
          <div class="card-body"><div class="kv" id="status-kv"></div></div>
        </section>
      </aside>
    </div>
  </div>
</main>
<script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
